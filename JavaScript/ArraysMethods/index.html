<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Methods</title>
</head>
<body>
    <h1>This is an Arrays Methods We use in the Form of :...</h1>
    <script>
        let arr = [1,2,3,4,5];
        let print = function(el){
            console.log(el);
        };
        arr.forEach(print);
    </script>
</body>
</html>
